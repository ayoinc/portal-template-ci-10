name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: '0'
  AWS_REGION: eu-west-1

jobs:
  credentials:
    name: Deployment credentials
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - name: Check that a role and a state bucket are configured
        id: check
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN || vars.AWS_ROLE_ARN }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          if [ -n "$AWS_ROLE_ARN" ] && [ -n "$TF_STATE_BUCKET" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Plan and apply are skipped until AWS_ROLE_ARN and TF_STATE_BUCKET are configured."
          fi

  plan:
    name: Plan
    needs: credentials
    if: needs.credentials.outputs.available == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN || vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false

      - name: Initialise
        run: >
          terraform init
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="key=${{ github.event.repository.name }}/terraform.tfstate"
          -backend-config="region=${{ vars.TF_STATE_REGION || env.AWS_REGION }}"
          -backend-config="use_lockfile=true"

      - name: Plan
        run: terraform plan -out=tfplan

      # build/ holds the archives Terraform made from the sources in this
      # repository; the plan refers to them by path.
      - uses: actions/upload-artifact@v7
        with:
          name: tfplan
          path: |
            tfplan
            build/
          if-no-files-found: error

  apply:
    name: Apply
    needs: plan
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN || vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false

      - name: Initialise
        run: >
          terraform init
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="key=${{ github.event.repository.name }}/terraform.tfstate"
          -backend-config="region=${{ vars.TF_STATE_REGION || env.AWS_REGION }}"
          -backend-config="use_lockfile=true"

      - uses: actions/download-artifact@v8
        with:
          name: tfplan
          path: .

      - name: Apply
        run: terraform apply tfplan

      - name: Shift traffic to the new function version
        run: bash scripts/shift-traffic.sh
