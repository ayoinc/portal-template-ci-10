name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: '0'

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.1

      - name: Check formatting
        run: terraform fmt -check -recursive -diff

      - name: Initialise without a backend
        run: terraform init -backend=false

      - name: Validate
        run: terraform validate

      # Plans with the committed values against mocked providers (tests/),
      # which needs no cloud credentials.
      - name: Test the configuration
        run: terraform test

      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.66.0

      - name: Lint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init
          tflint --format compact

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Scan the Terraform configuration with Trivy
        run: >
          docker run --rm -v "$PWD:/src" ghcr.io/aquasecurity/trivy:0.76.2
          config --severity HIGH,CRITICAL --exit-code 1 /src

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install MkDocs with the TechDocs plugins
        run: pip install mkdocs-techdocs-core==1.7.1

      - name: Build the documentation
        run: mkdocs build --strict
